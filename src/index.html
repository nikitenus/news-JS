<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="description" content="News Portal - fresh stories from trusted sources" />
        <title>News Portal</title>
    </head>
    <body>
        <header class="header">
            <div class="container header__inner">
                <div class="header__brand">
                    <span class="header__logo" aria-hidden="true">N</span>
                    <div class="header__text">
                        <h1 class="header__title">News <span>Portal</span></h1>
                        <p class="header__subtitle">Fresh stories from trusted sources</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="sources-section" aria-labelledby="sources-title">
                <div class="container">
                    <h2 class="section-title" id="sources-title">Sources</h2>
                    <div class="sources"></div>
                </div>
            </section>

            <section class="news-section" aria-labelledby="news-title">
                <div class="container">
                    <h2 class="section-title" id="news-title">Latest news</h2>
                    <div class="news"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container footer__inner">
                <p class="footer__author">
                    <span>&copy; 2026</span>
                    <a href="https://github.com/nikitenus" target="_blank" rel="noopener noreferrer">nikitenus</a>
                </p>
                <a
                    class="footer__course"
                    href="https://rs.school/courses/javascript"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="RS School JavaScript course"
                >
                    <img
                        src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                        alt="RS School"
                        width="40"
                        height="40"
                    />
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </article>
        </template>
    </body>
</html>
